<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home | Blog it 📝</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <nav class="app-nav d-flex align-items-center">
  <a class="brand" href="dashboard.html"><span class="brand-mark">B</span>Blog it</a>
  <div class="ms-auto d-flex align-items-center gap-3">
    <div id="user-info" class="d-flex align-items-center gap-2">
      <i class="bi bi-person-circle fs-5"></i>
      <span id="username" class="fw-semibold"></span>
    </div>
    <button id="logout-btn" class="btn btn-outline-light btn-sm">Logout</button>
  </div>
</nav>

  <main class="dashboard-shell">
    <header class="dashboard-heading">
      <h1 class="display-serif">Your ideas, in public.</h1>
      <p>Write something worth sharing with the people who find it.</p>
    </header>

    <section class="composer" aria-labelledby="composer-title">
      <h2 id="composer-title">Create a post</h2>
      <input type="text" id="title" class="form-control mb-2" placeholder="Post Title" />
      <textarea id="content" class="form-control mb-2" rows="4" placeholder="Write your blog post..."></textarea>
      <div class="d-flex flex-wrap gap-2 mt-2">
        <button id="publish-btn" class="btn btn-success">Publish post</button>
        <button id="sample-post-btn" type="button" class="btn btn-outline-primary">Use sample post</button>
      </div>
    </section>

    <section class="posts-section" aria-labelledby="posts-title">
      <h2 id="posts-title">Recent posts</h2>
      <div id="posts"></div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
